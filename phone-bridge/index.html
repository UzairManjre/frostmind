<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FROSTMIND Phone Bridge</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />

<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">&#10052;&#65039;</div>
    <div>
      <h1>FROSTMIND</h1>
      <div class="subtitle">phone bridge</div>
    </div>
  </div>
  <button id="settings-toggle" type="button">Settings</button>
</header>

<main>
  <section class="card" id="settings-panel">
    <h2>Settings</h2>
    <label>Backend API base URL
      <input type="text" id="api-base-input" placeholder="http://192.168.1.20:8000" />
    </label>
    <button id="save-settings-btn">Save &amp; test connection</button>
    <p class="status" id="settings-status"></p>
    <button id="reset-btn" class="danger">Reset wizard / clear local state</button>
  </section>

  <div id="app"></div>
</main>

<script type="module" src="js/app.js"></script>
